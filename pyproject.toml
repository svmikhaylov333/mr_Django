[project]
name = "mr-django"
version = "0.1.0"
description = ""
authors = [
    {name = "MC"}
]
requires-python = "^3.13"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "ipython (>=9.17.1,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.4.1,<8.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "django-stubs (>=6.1.2,<7.0.0)"
]

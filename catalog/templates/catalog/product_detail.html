{% extends 'catalog/home.html' %}
{%block content %}
<div class="container">
    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h1 class="display-4">Mr. Django</h1>
        <p class="lead">Магазин электроники</p>
    </div>
    <div class="row text-center">

                <div class="col-12">
                    <div class="card mb-4 box-shadow">
                        <div class="card-header">
                            <h4 class="my-0 font-weight-normal">
                                {{ object.name }}{% if object.name|length < 19 %}<br>&nbsp;{% endif %}
                            </h4>
                        </div>
                        <div class="card-body">
                            {% if product.image %}
                                <img src="{{ product.image.url }}" alt="{{ product.name }}"
                                     class="img-fluid mb-3" style="max-height: 150px; object-fit: contain;">
                            {% endif %}
                            <h1 class="card-title pricing-card-title">{{ object.price }} руб.</h1>

                            <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                                <li>{{ object.description|linebreaksbr}}</li>
                            </ul>
                            <button type="button" class="btn btn-lg btn-block btn-outline-primary">Купить</button>
                            <a href ="{% url 'catalog:product_update' object.pk %}" class="btn btn-lg btn-block btn-outline-secondary">Редактировать</a>
                        </div>
                    </div>
                </div>


    </div>
</div>
{% endblock %}

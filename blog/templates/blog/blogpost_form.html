{% extends 'catalog/home.html' %}
{% block content %}
<div class="container my-5">
<!--    <h2>Создать/редактировать</h2>-->
    <h2>{% if object %}Редактировать статью{% else %}Создать статью{% endif %}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        {% if object %}
                <a href="{% url 'blog:blogpost_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
        {% else %}
                <a href="{% url 'blog:blogpost_list' %}" class="btn btn-secondary">Отмена</a>
        {% endif %}
    </form>
</div>
{% endblock %}

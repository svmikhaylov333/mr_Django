{% extends 'catalog/home.html' %}
{% block content %}
<div class="container my-5">
    <h1>{{ object.title }}</h1>
    <p class="text-muted">Опубликовано: {{ object.created_at|date:"d.m.Y H:i" }} | Просмотров: {{ object.views_count }}</p>
    
    {% if object.preview %}
        <img src="{{ object.preview.url }}" class="img-fluid mb-4" alt="{{ object.title }}">
    {% endif %}
    
    <div class="content mb-4">
        {{ object.content|linebreaks }}
    </div>
    
    <hr>
    <div class="d-flex gap-2">
        <a href="{% url 'blog:blogpost_list' %}" class="btn btn-secondary">Назад к списку</a>
        <a href="{% url 'blog:blogpost_update' object.pk %}" class="btn btn-warning">Редактировать</a>
        <a href="{% url 'blog:blogpost_delete' object.pk %}" class="btn btn-danger">Удалить</a>
    </div>
</div>
{% endblock %}

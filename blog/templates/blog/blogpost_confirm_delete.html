{% extends 'catalog/home.html' %}
{% block content %}
<div class="container my-5">
    <h2>Точно удалить статью?</h2>
    <p><strong>{{ object.title }}</strong></p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да</button>
        <a href="{% url 'blog:blogpost_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
